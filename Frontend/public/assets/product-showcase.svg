<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Modern home product illustration</title>
  <desc id="desc">A sculptural ceramic vase with a leafy branch on a warm studio background.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4f1"/>
      <stop offset="1" stop-color="#d7e7f2"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfcf8"/>
      <stop offset="0.55" stop-color="#e7dfd1"/>
      <stop offset="1" stop-color="#c7b8a5"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#backdrop)"/>
  <circle cx="664" cy="116" r="118" fill="#fff" opacity=".32"/>
  <path d="M120 470h560" stroke="#fff" stroke-width="4" opacity=".7"/>
  <g filter="url(#shadow)">
    <path d="M422 188c-8 58-8 76 20 110 32 38 39 84 38 126-1 50-42 81-103 81s-102-31-103-81c-1-42 6-88 38-126 28-34 28-52 20-110z" fill="url(#ceramic)"/>
    <ellipse cx="377" cy="188" rx="42" ry="13" fill="#c8b9a5"/>
    <ellipse cx="377" cy="186" rx="31" ry="8" fill="#8e7d69" opacity=".42"/>
    <path d="M377 186C364 133 341 99 305 67M378 188c18-58 46-87 92-112M370 151c-38-19-65-19-94-2M393 141c39-28 67-30 97-17" fill="none" stroke="#285f57" stroke-linecap="round" stroke-width="8"/>
    <path d="M303 68c-30-24-58-22-75-5 20 26 46 37 75 5ZM468 76c23-28 53-37 78-22-11 31-38 45-78 22ZM278 148c-34-18-62-10-77 12 26 20 52 18 77-12ZM492 123c31-23 61-19 79 2-22 25-49 29-79-2ZM343 105c-29-22-55-20-72-4 18 26 43 33 72 4Z" fill="url(#leaf)"/>
